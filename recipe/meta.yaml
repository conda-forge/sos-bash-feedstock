{% set name = "sos-bash" %}
{% set version = "0.21.0" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/{{ name }}-{{ version }}.tar.gz
  sha256: 8b5b6aa4f2b992c742175084cacf3a562e4396b25b4727d227213c7df8a3c393

build:
  noarch: python
  number: 1
  script:
    - {{ PYTHON }} -m pip install . --no-deps --ignore-installed -vv

requirements:
  host:
    - pip
    - python {{ python_min }}
  run:
    - sos-notebook >=0.19.4
    - calysto_bash
    - python >={{ python_min }}

test:
  requires:
    - nose
    - pytest
    - selenium
    - python {{ python_min }}
  imports:
    - sos_bash

about:
  home: https://github.com/vatlab/sos-bash
  license: BSD-3-Clause
  license_file: LICENSE
  summary: SoS language module for bash
  doc_url: https://vatlab.github.io/sos-docs/
  dev_url: https://github.com/vatlab/sos-bash

extra:
  recipe-maintainers:
    - BoPeng
